services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pdfvision-db
    environment:
      POSTGRES_USER: pdfvision
      POSTGRES_PASSWORD: pdfvision
      POSTGRES_DB: pdfvision
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
